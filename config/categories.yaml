  Archives_and_Apps:
    extensions: [.zip, .tar, .gz, .dmg, .pkg, .exe]
    keywords:
      - installer
      - app
      - setup

  # Renamed from Metadata_System: the old name lured the LLM into filing
  # SAML `*-metadata.xml` documents here (observed at 95% confidence) when
  # they belong in Guidewire_PSE_Work. Name the bucket after what it holds
  # — OS cruft — not after a word that appears in real document filenames.
  # `.log` is deliberately NOT listed: it collides with Guidewire_PSE_Work
  # and the system-file check short-circuits first, which mis-filed
  # DigitalPortals_Test_2469.log as system junk.
  System_Junk:
    extensions: [.ds_store, .tmp, .cache, .localized, .cer]
    keywords:
      - gitignore

  Unknown_Unsorted:
    extensions: []
    keywords: []

settings:
  # AI is the primary classifier in distributed mode — workers run
  # AI -> HC-rules -> fallback-rules. The threshold below is what the
  # AI's answer must clear to short-circuit the rules safety net. 60 is
  # a good fit for 7B models (which tend to self-report 60-75 even when
  # right); raise to 80+ for 14B / 32B models which are more confident.
  confidence_threshold: 60
  max_extract_chars: 1500

  # Per-route Ollama model selection.
  #
  # Pull whatever you reference here BEFORE running the workers:
  #     ollama pull qwen2.5:7b
  #     ollama pull qwen2.5:14b
  #
  # Memory rule of thumb: model parameter count × ~0.7 GB. A 32B model
  # eats ~20 GB of RAM in Ollama and is ~15-30 s/call on CPU — too heavy
  # for the ai-small queue, which sees the bulk of the traffic.
  models:
    ai-small: "qwen2.5:7b"      # fast model for the fan-out queue
    ai-large: "qwen2.5:14b"     # bigger context for large extractable docs

  # Legacy keys, kept for backward compat with the inline `smartsort run`
  # path. Distributed workers prefer `models.<route>` above.
  default_local_model: "qwen2.5:7b"
  large_model: "qwen2.5:14b"

  # NEVER auto-moved. Surfaced for rotation/destruction, not relocation.
  # Company infrastructure secrets must not travel off the company's estate;
  # personal 2FA recovery codes should be regenerated rather than copied.
  Credentials_Secrets:
    extensions: [.txt, .csv, .json, .pem, .key, .p12, .pfx, .keystore, .cer]
    keywords:
      - "recovery codes"
      - "access key"
      - accesskeys
      - credentials
      - password
      - passphrase
      - secret
      - apikey
      - "api key"
      - keystore
      - truststore
      - "private key"
      - id_rsa

  # Third-party customer configuration (SAML/SSO metadata, tenant configs).
  # Not yours and not merely "your work" — this is customer data and must
  # stay on the company's estate.
  Customer_Data:
    extensions: [.xml, .json, .csv]
    keywords:
      - "customer metadata"
      - "customer-metadata"
      - saml
      - idp
      - sso
      - "identity provider"
      - "service provider"
      - tenant


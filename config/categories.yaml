  # YOUR OWN employment paperwork — the records an employer issues *to you*
  # and that you are entitled to keep: offer letters, transfer letters,
  # verification letters, payslip cover notes, resignation, relieving and
  # experience certificates, onboarding/offboarding paperwork.
  #
  # This is deliberately distinct from Guidewire_PSE_Work, which is the
  # company's work product. The offboarding split treats this category as
  # KEEP and Guidewire_PSE_Work as LEAVE.
  Employment_Records:
    extensions: [.pdf, .docx, .eml, .msg, .txt]
    keywords:
      - "offer of employment"
      - "offer letter"
      - "employment agreement"
      - "employment contract"
      - "international transfer"
      - "transfer letter"
      - "flex work"
      - "relieving letter"
      - "experience letter"
      - "experience certificate"
      - "service certificate"
      - resignation
      - onboarding
      - offboarding
      - "background check"
      - "last working day"
      - "notice period"
      - separation
      - "exit formalities"
      - appraisal
      - "performance review"
      - promotion
      - "compensation review"
      - "salary revision"
      - rsu
      - "stock options"
      - "equity grant"

  # Credentials earned by you personally — these travel with you.
  Certifications_Training:
